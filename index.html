<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Store Behavior Dashboard — Demo</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--ink:#0b2b2e;--muted:#6b7f82;--faint:#9db0b2;--line:#e3ebeb;--teal:#0f6e56;--teal-mid:#1d9e75;--teal-lt:#e1f5ee;--amber:#ba7517;--amber-lt:#faeeda;--red:#a32d2d;--red-lt:#fcebeb;--bg:#f5f8f8;--card:#ffffff;--dark:#004956;}
*{box-sizing:border-box;margin:0;padding:0;font-family:"Segoe UI",system-ui,-apple-system,sans-serif;}
body{background:var(--bg);color:var(--ink);padding:24px;max-width:1240px;margin:0 auto;}
h1{font-size:22px;font-weight:600;}
.sub{color:var(--muted);font-size:13px;margin-top:2px;}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;}
.topbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:18px;}
select{border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13px;background:var(--card);color:var(--ink);cursor:pointer;}
select:hover{border-color:var(--teal-mid);}
.chip{font-size:12px;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 12px;}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.split32{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:12px;}
@media(max-width:1000px){
 .grid5,.grid4,.tstrip{display:flex;overflow-x:auto;padding-bottom:8px;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;}
 .grid5>*,.grid4>*{min-width:195px;flex:0 0 auto;scroll-snap-align:start;}
 .tstrip>*{min-width:185px;flex:0 0 auto;scroll-snap-align:start;}
 .split32,.grid2{grid-template-columns:1fr;}
}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;overflow-x:auto;min-width:0;}
.kpi{cursor:pointer;transition:box-shadow .15s,transform .15s;position:relative;}
.kpi:hover{box-shadow:0 4px 14px rgba(0,73,86,.10);transform:translateY(-1px);}
.kpi .lbl{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;}
.kpi .val{font-size:26px;font-weight:650;margin:4px 0 2px;}
.kpi .delta{font-size:12px;font-weight:600;}
.up{color:var(--teal);}
.down{color:var(--red);}
.flat{color:var(--muted);}
.spark{height:38px;margin-top:6px;}
.badge{font-size:10px;background:var(--teal-lt);color:var(--teal);border-radius:999px;padding:2px 8px;font-weight:600;}
.badge.warn{background:var(--amber-lt);color:var(--amber);}
.sec{margin-top:22px;}
.sec h2{font-size:15px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.freshness{font-size:11px;color:var(--faint);font-weight:400;}
.ttabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
.ttab{font-size:12px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 14px;cursor:pointer;color:var(--muted);}
.ttab.on{background:var(--dark);color:#fff;border-color:var(--dark);}
.tstrip{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;}
.tcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;position:relative;cursor:pointer;}
.tcard:hover{border-color:var(--teal-mid);}
.tcard .rank{position:absolute;top:10px;right:12px;width:20px;height:20px;border-radius:50%;background:var(--teal-lt);color:var(--teal);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;}
.tcard .nm{font-size:13px;font-weight:600;padding-right:24px;min-height:34px;}
.tcard .ct{font-size:12px;color:var(--muted);margin-top:4px;}
.lens{display:flex;border-bottom:2px solid var(--line);margin:26px 0 16px;}
.lens button{background:none;border:none;font-size:14px;padding:10px 18px;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;font-weight:500;}
.lens button.on{color:var(--dark);border-bottom-color:var(--teal-mid);font-weight:650;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;color:var(--muted);font-weight:500;font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line);}
td{padding:9px 10px;border-bottom:1px solid var(--line);}
tr:last-child td{border-bottom:none;}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;}
.bar-wrap{background:var(--teal-lt);border-radius:4px;height:20px;overflow:hidden;}
.bar{background:var(--teal-mid);height:100%;border-radius:4px;}
.f-row{display:flex;align-items:center;gap:10px;margin-bottom:7px;}
.f-lb{width:130px;font-size:12px;color:var(--muted);flex-shrink:0;}
.f-track{flex:1;}
.f-val{width:120px;text-align:right;font-size:12px;color:var(--muted);flex-shrink:0;font-variant-numeric:tabular-nums;}
.seg{display:flex;gap:4px;}
.seg button{font-size:11px;border:1px solid var(--line);background:var(--card);padding:4px 10px;cursor:pointer;color:var(--muted);}
.seg button:first-child{border-radius:6px 0 0 6px;}
.seg button:last-child{border-radius:0 6px 6px 0;}
.seg button.on{background:var(--teal-lt);color:var(--teal);border-color:var(--teal-mid);font-weight:600;}
.insight{border-left:4px solid var(--amber);border-radius:0 14px 14px 0;}
.insight.pos{border-left-color:var(--teal-mid);}
.insight .tag{font-size:10px;font-weight:700;color:var(--amber);background:var(--amber-lt);padding:2px 8px;border-radius:999px;}
.insight.pos .tag{color:var(--teal);background:var(--teal-lt);}
.insight p{font-size:13px;margin:8px 0 10px;line-height:1.5;}
.cta{background:var(--dark);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:12px;cursor:pointer;font-weight:600;}
.cta:hover{background:#00343f;}
.cta.ghost{background:none;color:var(--dark);border:1px solid var(--line);}
.overlay{position:fixed;inset:0;background:rgba(4,42,48,.45);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;z-index:50;}
.overlay.open{display:flex;}
.modal{background:var(--card);border-radius:16px;max-width:860px;width:100%;padding:24px;}
.modal h3{font-size:18px;}
.mgrid{display:grid;grid-template-columns:3fr 2fr;gap:16px;margin-top:16px;}
@media(max-width:800px){.mgrid{grid-template-columns:1fr;}}
.mover{display:flex;justify-content:space-between;font-size:13px;padding:8px 0;border-bottom:1px solid var(--line);}
.xbtn{float:right;background:none;border:none;font-size:20px;cursor:pointer;color:var(--muted);}
.cohort{display:grid;grid-template-columns:90px repeat(6,1fr);gap:4px;font-size:11px;}
.cohort .c{padding:8px 4px;text-align:center;border-radius:6px;font-weight:600;}
.cohort .h{color:var(--muted);font-weight:500;text-align:center;padding:4px;}
.note{font-size:12px;color:var(--faint);margin-top:10px;}
.quad{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;}
</style>
</head>
<body>

<div class="topbar">
  <div>
    <h1>Store behavior</h1>
    <div class="sub">Demo with sample data · Store Behavior Dashboard spec · Salla Analytics</div>
  </div>
  <div class="row">
    <select id="fRange" onchange="setF()"><option value="7">Last 7 days</option><option value="30" selected>Last 30 days</option><option value="90">Last 90 days</option></select>
    <select id="fChannel" onchange="setF()"><option value="all">All channels</option></select>
    <select id="fDevice" onchange="setF()"><option value="all">All devices</option><option value="mobile">Mobile</option><option value="desktop">Desktop</option></select>
    <span class="chip" id="cmpChip"></span>
  </div>
</div>

<div class="grid5" id="pulse"></div>

<div class="sec">
  <h2>Trending now <span class="freshness">updated 4 min ago</span></h2>
  <div class="ttabs" id="tTabs"></div>
  <div class="tstrip" id="tStrip"></div>
</div>

<div class="lens" id="lens">
  <button data-l="acq">Acquisition</button>
  <button data-l="conv" class="on">Conversion</button>
  <button data-l="ret">Retention</button>
</div>

<div id="lensBody"></div>

<div class="sec">
  <h2>Insights <span class="freshness">rule-based · max 2 shown</span></h2>
  <div class="grid2" id="insights"></div>
</div>

<div class="overlay" id="overlay" onclick="if(event.target===this)closeDrill()">
  <div class="modal">
    <button class="xbtn" onclick="closeDrill()">×</button>
    <h3 id="mTitle"></h3>
    <div class="sub" id="mSub"></div>
    <div style="height:220px;margin-top:16px;"><canvas id="mChart"></canvas></div>
    <div class="mgrid">
      <div>
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
          <h2 style="font-size:13px;">Breakdown by</h2>
          <select id="mDimSel" style="padding:4px 8px;font-size:12px;" onchange="mDim=this.value;renderDrillBreakdown()">
            <option value="ch">Channel</option><option value="dev">Device</option>
            <option value="city">City</option><option value="theme">Theme version</option>
          </select>
        </div>
        <div id="mTable"></div>
      </div>
      <div>
        <h2 style="font-size:13px;margin-bottom:6px;">What drove the change</h2>
        <div id="mMovers"></div>
        <div class="card insight" id="mAction" style="margin-top:14px;padding:12px;">
          <span class="tag">Recommended action</span>
          <p id="mActionTxt"></p>
          <button class="cta" id="mCta"></button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
/* ---------- seeded data generation ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const rnd=mulberry32(20260713);
const CH=[
 {n:"Instagram",share:.29,cr:1.10},
 {n:"Direct",share:.23,cr:1.35},
 {n:"Snapchat",share:.20,cr:0.42},
 {n:"Organic search",share:.12,cr:1.00},
 {n:"Google Ads",share:.10,cr:0.92},
 {n:"Email / SMS",share:.06,cr:1.70}
];
const DEV=[{n:"mobile",share:.72,cr:0.82},{n:"desktop",share:.28,cr:1.55}];
const DAYS=180, BASE=4300, THEME_DAY=21; /* theme v2.3 went live 21 days ago */
const DATA=[];
for(let d=0;d<DAYS;d++){
  const dow=(d+3)%7;                       // weekday index
  const wk=(dow===4||dow===5)?1.22:1.0;    // Fri/Sat lift
  const growth=1+ d*0.0011;
  for(const c of CH)for(const v of DEV){
    const s=Math.round(BASE*c.share*v.share*wk*growth*(0.86+rnd()*0.28));
    const pv=Math.round(s*(0.58+rnd()*0.08));
    const atc=Math.round(pv*(0.26+rnd()*0.07));
    const co=Math.round(atc*(0.40+rnd()*0.10));
    const pay=Math.round(co*(0.66+rnd()*0.12));
    let ord=Math.round(pay*Math.min(0.92,(0.42+rnd()*0.10)*c.cr*v.cr));
    if(d>=DAYS-THEME_DAY)ord=Math.round(ord*1.08); /* v2.3 uplift */
    ord=Math.min(ord,pay);
    const rev=Math.round(ord*(215+rnd()*130));
    DATA.push({d,ch:c.n,dev:v.n,s,pv,atc,co,pay,ord,rev});
  }
}
/* ---------- state & helpers ---------- */
let F={range:30,ch:"all",dev:"all"},lensOn="conv",tTabOn=0,funnelSeg="all";
const charts={};
const el=id=>document.getElementById(id);
const fmt=n=>n>=1e6?(n/1e6).toFixed(1)+"M":n>=1e3?(n/1e3).toFixed(1)+"K":(""+Math.round(n));
const pct=(a,b)=>b?100*a/b:0;
function rows(off,len){const hi=DAYS-1-off,lo=hi-len+1;
  return DATA.filter(r=>r.d>=lo&&r.d<=hi&&(F.ch==="all"||r.ch===F.ch)&&(F.dev==="all"||r.dev===F.dev));}
function agg(rs){const o={s:0,pv:0,atc:0,co:0,pay:0,ord:0,rev:0};for(const r of rs){o.s+=r.s;o.pv+=r.pv;o.atc+=r.atc;o.co+=r.co;o.pay+=r.pay;o.ord+=r.ord;o.rev+=r.rev;}return o;}
function daily(rs,fn){const m={};for(const r of rs){m[r.d]=m[r.d]||[];m[r.d].push(r);}
  return Object.keys(m).sort((a,b)=>a-b).map(k=>fn(agg(m[k])));}
function deltaTxt(cur,prev,pts){if(prev===0)return{t:"—",c:"flat"};
  const d=pts?cur-prev:100*(cur-prev)/prev;
  if(Math.abs(d)<(pts?0.05:0.8))return{t:"— flat",c:"flat"};
  return{t:(d>0?"▲ ":"▼ ")+Math.abs(d).toFixed(1)+(pts?" pts":"%"),c:d>0?"up":"down"};}
/* ---------- KPI definitions ---------- */
const KPI={
 sessions:{lbl:"Sessions",v:a=>a.s,f:a=>fmt(a.s),pts:false,
   act:"Snapchat sessions fell the most this period. Review campaign budget and creatives before scaling further.",cta:"Open marketing tools"},
 cr:{lbl:"Conversion rate",v:a=>pct(a.ord,a.s),f:a=>pct(a.ord,a.s).toFixed(2)+"%",pts:true,
   act:"The largest drop in your funnel is between add to cart and checkout. Enable abandoned cart recovery to win these sessions back.",cta:"Create recovery campaign"},
 rps:{lbl:"Revenue / session",v:a=>a.rev/(a.s||1),f:a=>"SAR "+(a.rev/(a.s||1)).toFixed(2),pts:false,
   act:"Snapchat brings 20% of traffic but the lowest revenue per session. Shift budget toward Email / SMS and Direct.",cta:"Review channels"},
 ret:{lbl:"Returning customers",v:a=>31.2,f:a=>"31%",pts:true,fixed:[29.8,31.2],
   act:"1,240 visitors returned to the same product without buying. Send them a limited-time coupon.",cta:"Create targeted coupon"},
 eng:{lbl:"Engagement rate",v:a=>pct(a.pv,a.s)+16,f:a=>(pct(a.pv,a.s)+16).toFixed(0)+"%",pts:true,
   act:"Your offers landing page has the lowest engagement of your top entry pages. Review its content and load speed.",cta:"View landing pages"},
 pvr:{lbl:"Product view rate",v:a=>pct(a.pv,a.s),f:a=>pct(a.pv,a.s).toFixed(1)+"%",pts:true,
   act:"Sessions that use search convert 2x more. Make search more prominent on mobile.",cta:"Store settings"},
 atc:{lbl:"Add-to-cart rate",v:a=>pct(a.atc,a.s),f:a=>pct(a.atc,a.s).toFixed(1)+"%",pts:true,
   act:"3 products get heavy views but few cart adds. Review pricing and photos on your 'leaking traffic' list.",cta:"View products"},
 cco:{lbl:"Checkout completion",v:a=>pct(a.ord,a.co),f:a=>pct(a.ord,a.co).toFixed(0)+"%",pts:true,
   act:"COD checkouts complete 18 pts less than online payments on mobile. Review COD confirmation flow.",cta:"Payment settings"},
 aban:{lbl:"Cart abandonment",v:a=>100-pct(a.ord,a.atc),f:a=>(100-pct(a.ord,a.atc)).toFixed(0)+"%",pts:true,
   act:"42% of abandonments happen when shipping cost appears. Consider a free-shipping threshold near SAR 200.",cta:"Shipping settings"},
 aov:{lbl:"AOV",v:a=>a.rev/(a.ord||1),f:a=>"SAR "+Math.round(a.rev/(a.ord||1)),pts:false,
   act:"Orders paid with BNPL average SAR 85 higher. Highlight BNPL on product pages.",cta:"Payment settings"},
 nvis:{lbl:"Unique visitors",v:a=>a.s*0.74,f:a=>fmt(a.s*0.74),pts:false,
   act:"Reach is growing but new visitor conversion lags returning visitors. Review first-visit landing pages.",cta:"View landing pages"},
 nshare:{lbl:"New visitor share",v:a=>63.5,f:a=>"64%",pts:true,fixed:[61.9,63.5],
   act:"Most of your traffic is new. Balance acquisition spend with retention flows.",cta:"Retention tools"},
 nvcr:{lbl:"New visitor CR",v:a=>pct(a.ord,a.s)*0.7,f:a=>(pct(a.ord,a.s)*0.7).toFixed(2)+"%",pts:true,
   act:"New visitors from Snapchat rarely buy on first visit. Retarget them within 48 hours.",cta:"Marketing tools"},
 rvr:{lbl:"Returning visitor rate",v:a=>36.5,f:a=>"37%",pts:true,fixed:[38.1,36.5],
   act:"Fewer visitors are coming back before purchase. Consider push or email reminders.",cta:"Campaigns"},
 rpr:{lbl:"Repeat purchase rate",v:a=>22.4,f:a=>"22%",pts:true,fixed:[21.0,22.4],
   act:"Repeat purchase is improving. Reinforce with a loyalty program.",cta:"Loyalty apps"},
 t2o:{lbl:"Time to 2nd order",v:a=>19,f:a=>"19 days",pts:false,fixed:[21,19],
   act:"Median gap to second order is 19 days. Schedule win-back messages at day 14.",cta:"Schedule automation"},
 r30:{lbl:"30-day retention",v:a=>14.8,f:a=>"14.8%",pts:true,fixed:[13.9,14.8],
   act:"March cohort retains best. Compare its acquisition mix with weaker cohorts.",cta:"View cohorts"}
};
function kpiCard(key,badge){
  const a=agg(rows(0,F.range)),p=agg(rows(F.range,F.range)),k=KPI[key];
  let cur=k.v(a),prev=k.v(p);
  if(k.fixed){prev=k.fixed[0];cur=k.fixed[1];}
  const d=deltaTxt(cur,prev,k.pts);
  return `<div class="card kpi" onclick="openDrill('${key}')">
    <div class="lbl"><span>${k.lbl}</span>${badge?`<span class="badge">benchmark</span>`:""}</div>
    <div class="val">${k.f(a)}</div><div class="delta ${d.c}">${d.t}</div>
    <div class="spark"><canvas id="sp_${key}"></canvas></div></div>`;
}
function spark(key){
  const k=KPI[key],series=daily(rows(0,F.range),k.v);
  mkChart("sp_"+key,{type:"line",data:{labels:series.map((_,i)=>i),datasets:[{data:series,borderColor:"#1d9e75",borderWidth:1.6,pointRadius:0,fill:true,backgroundColor:"rgba(29,158,117,.08)",tension:.35}]},
  options:{plugins:{legend:{display:false},tooltip:{enabled:false}},scales:{x:{display:false},y:{display:false}},responsive:true,maintainAspectRatio:false,animation:false}});
}
function mkChart(id,cfg){if(charts[id])charts[id].destroy();const c=el(id);if(c)charts[id]=new Chart(c,cfg);}
/* ---------- pulse ---------- */
const PULSE=["sessions","cr","rps","ret","eng"];
function renderPulse(){el("pulse").innerHTML=PULSE.map((k,i)=>kpiCard(k,i===1)).join("");PULSE.forEach(spark);}
/* ---------- trending ---------- */
const TREND=[
 {t:"Products viewed",items:[["Mays Lavender perfume 100ml","4,820 views",38],["Apple Watch Series 9","3,910 views",24],["AirPods Pro","3,140 views",19],["27\" gaming monitor","2,270 views",11],["Leather bag","1,880 views",-6]],q:"Open product behavior detail: views, add-to-cart, and purchase mini-funnel."},
 {t:"Added to cart",items:[["Apple Watch Series 9","612 carts",31],["Mays Lavender perfume","540 carts",22],["AirPods Pro","387 carts",9],["Smart water bottle","201 carts",44],["Leather bag","96 carts",-12]],q:"Product cart detail with view-to-cart outliers."},
 {t:"Cities",items:[["Riyadh","38.2K sessions",14],["Jeddah","24.6K sessions",9],["Dammam","11.3K sessions",21],["Makkah","8.9K sessions",5],["Abha","4.2K sessions",-8]],q:"City detail: CR, AOV, top products, shipping options."},
 {t:"Traffic sources",items:[["Instagram","41.2K sessions",12],["Direct","32.8K sessions",7],["Snapchat","28.5K sessions",-18],["Organic search","15.9K sessions",4],["Email / SMS","7.1K sessions",26]],q:"Channel quality funnel for this source."},
 {t:"Search terms",items:[["perfume","2,410 searches",33],["apple watch","1,870 searches",18],["gift box","1,240 searches",52],["airpods","980 searches",7],["abaya","640 searches — 0 results",120]],q:"Search funnel for this term."}
];
function renderTrend(){
  el("tTabs").innerHTML=TREND.map((t,i)=>`<button class="ttab ${i===tTabOn?'on':''}" onclick="tTabOn=${i};renderTrend()">${t.t}</button>`).join("");
  el("tStrip").innerHTML=TREND[tTabOn].items.map((it,i)=>{
    const d=it[2],cls=d>0?"up":"down",zero=it[1].includes("0 results");
    return `<div class="tcard" title="${TREND[tTabOn].q}"><div class="rank">${i+1}</div>
      <div class="nm">${it[0]}</div><div class="ct">${it[1]}</div>
      <div class="delta ${cls}" style="font-size:12px;margin-top:4px;">${d>0?"▲":"▼"} ${Math.abs(d)}%${zero?' <span class="badge warn">add product</span>':""}</div></div>`;}).join("");
}
/* ---------- funnels ---------- */
function funnelHTML(stages,title,segControls){
  const max=stages[0].v;
  return `<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
    <strong style="font-size:14px;">${title}</strong>${segControls||""}</div>
    ${stages.map((s,i)=>{
      const rate=i===0?100:pct(s.v,stages[i-1].v);
      const worst=s.worst?` style="background:#faeeda;"`:"";
      const barColor=s.worst?"#ef9f27":"#1d9e75";
      return `<div class="f-row"><div class="f-lb">${s.n}</div>
        <div class="f-track"><div class="bar-wrap"${worst}><div class="bar" style="width:${Math.max(2,pct(s.v,max))}%;background:${barColor};"></div></div></div>
        <div class="f-val">${fmt(s.v)}${i>0?` · ${rate.toFixed(0)}%`:""}${s.worst?" ⚠":""}</div></div>`;}).join("")}
    <div class="note" id="fnote"></div></div>`;
}
function storeFunnel(){
  const rs=rows(0,F.range).filter(r=>funnelSeg==="all"||r.dev===funnelSeg);
  const a=agg(rs);
  const st=[{n:"Sessions",v:a.s},{n:"Product view",v:a.pv},{n:"Add to cart",v:a.atc},{n:"Checkout started",v:a.co},{n:"Payment started",v:a.pay},{n:"Order completed",v:a.ord}];
  let worst=1,wr=101;
  for(let i=1;i<st.length;i++){const r=pct(st[i].v,st[i-1].v);if(r<wr){wr=r;worst=i;}}
  st[worst].worst=true;
  const seg=`<div class="seg">${["all","mobile","desktop"].map(s=>`<button class="${funnelSeg===s?'on':''}" onclick="funnelSeg='${s}';renderLens()">${s[0].toUpperCase()+s.slice(1)}</button>`).join("")}</div>`;
  return funnelHTML(st,"Store conversion funnel (F1)",seg)
    .replace('<div class="note" id="fnote"></div>',`<div class="note">Biggest drop: ${st[worst-1].n.toLowerCase()} → ${st[worst].n.toLowerCase()} (${(100-wr).toFixed(0)}% lost). Toggle segments to compare mobile vs desktop.</div>`);
}
function checkoutFunnel(){
  const a=agg(rows(0,F.range));
  const pm=[["COD",.34,.61],["Mada",.31,.83],["Apple Pay",.20,.90],["BNPL (Tamara/Tabby)",.15,.86]];
  return `<div class="card"><strong style="font-size:14px;">Checkout completion by payment method (F2)</strong>
    <table style="margin-top:10px;"><tr><th>Method</th><th class="num">Checkouts</th><th class="num">Completion</th><th style="width:34%;"></th></tr>
    ${pm.map(p=>{const co=Math.round(a.co*p[1]),comp=p[2]*100;
      const warn=comp<70;
      return `<tr><td>${p[0]}</td><td class="num">${fmt(co)}</td><td class="num" style="${warn?'color:var(--red);font-weight:600;':''}">${comp.toFixed(0)}%${warn?" ⚠":""}</td>
      <td><div class="bar-wrap" style="height:12px;"><div class="bar" style="width:${comp}%;background:${warn?'#e24b4a':'#1d9e75'};"></div></div></td></tr>`;}).join("")}
    </table><div class="note">COD completes 22 pts below Apple Pay. GCC-specific friction that GA4 cannot see.</div></div>`;
}
function channelTable(){
  const rs=rows(0,F.range),m={};
  for(const r of rs){m[r.ch]=m[r.ch]||{s:0,ord:0,rev:0,atc:0};const o=m[r.ch];o.s+=r.s;o.ord+=r.ord;o.rev+=r.rev;o.atc+=r.atc;}
  const arr=Object.entries(m).sort((a,b)=>b[1].s-a[1].s);
  return `<div class="card"><strong style="font-size:14px;">Channel quality (F3)</strong>
    <table style="margin-top:10px;"><tr><th>Channel</th><th class="num">Sessions</th><th class="num">ATC rate</th><th class="num">CR</th><th class="num">Rev / session</th></tr>
    ${arr.map(([n,o])=>{const cr=pct(o.ord,o.s),bad=cr<1.5;
     return `<tr><td>${n}</td><td class="num">${fmt(o.s)}</td><td class="num">${pct(o.atc,o.s).toFixed(1)}%</td>
     <td class="num" style="${bad?'color:var(--red);font-weight:600;':''}">${cr.toFixed(2)}%${bad?" ⚠":""}</td>
     <td class="num">SAR ${(o.rev/o.s).toFixed(2)}</td></tr>`;}).join("")}</table>
    <div class="note">Sorted by volume. Flags: channels sending visitors, not buyers.</div></div>`;
}
function productQuadrants(){
  const P=[["Mays Lavender perfume","winner","Your winners","#e1f5ee","#0f6e56","4,820 views · CR 4.1%","Feature on homepage"],
   ["Smart water bottle","gem","Hidden gems","#eeedfe","#534ab7","310 views · CR 5.2%","Promote in campaigns"],
   ["27\" gaming monitor","leak","Leaking traffic","#fcebeb","#a32d2d","2,270 views · CR 0.4%","Fix price / photos"],
   ["Leather bag","price","Price-sensitive","#faeeda","#854f0b","480 carts · 78% abandoned","Send targeted coupon"]];
  return `<div class="card"><strong style="font-size:14px;">Product performance quadrants</strong>
    <table style="margin-top:10px;"><tr><th>Product</th><th>Quadrant</th><th>Signal</th><th>Action</th></tr>
    ${P.map(p=>`<tr><td>${p[0]}</td><td><span class="quad" style="background:${p[3]};color:${p[4]};">${p[2]}</span></td><td style="color:var(--muted);font-size:12px;">${p[5]}</td><td style="font-size:12px;">${p[6]}</td></tr>`).join("")}
    </table></div>`;
}
function designImpact(){
  const win=THEME_DAY;
  const after=agg(rows(0,win)),before=agg(rows(win,win));
  if(after.s<1000)return `<div class="card"><strong style="font-size:14px;">Design impact — theme update</strong>
    <p style="font-size:13px;margin-top:10px;color:var(--muted);">Collecting data since your theme update. Results will appear once enough sessions are recorded.</p></div>`;
  const mCR=[pct(before.ord,before.s),pct(after.ord,after.s)];
  const mATC=[pct(before.atc,before.s),pct(after.atc,after.s)];
  const mCCO=[pct(before.ord,before.co),pct(after.ord,after.co)];
  const dCR=mCR[1]-mCR[0];
  const verdict=Math.abs(dCR)<0.05?"no clear change in conversion yet":(dCR>0?`conversion is up <strong class="up">${dCR.toFixed(2)} pts</strong>`:`conversion is down <strong class="down">${Math.abs(dCR).toFixed(2)} pts</strong>`);
  const row=(n,b,a2)=>{const d=a2-b,cls=d>0.02?"up":d<-0.02?"down":"flat";
    return `<tr><td>${n}</td><td class="num">${b.toFixed(2)}%</td><td class="num">${a2.toFixed(2)}%</td><td class="num ${cls}">${d>0?"+":""}${d.toFixed(2)} pts</td></tr>`;};
  return `<div class="card"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;align-items:center;">
    <strong style="font-size:14px;">Design impact — theme update</strong>
    <span class="chip">Raed v2.2 → v2.3 · switched ${THEME_DAY} days ago</span></div>
    <p style="font-size:13px;margin:10px 0 2px;">Since updating to <strong>v2.3</strong>, ${verdict}.</p>
    <table style="margin-top:8px;"><tr><th>Metric</th><th class="num">Before (${win}d)</th><th class="num">After (${win}d)</th><th class="num">Change</th></tr>
    ${row("Conversion rate",mCR[0],mCR[1])}
    ${row("Add-to-cart rate",mATC[0],mATC[1])}
    ${row("Checkout completion",mCCO[0],mCCO[1])}</table>
    <div class="note">Matching ${win}-day windows before and after the switch. Traffic mix also changed in this period, so this is an observed difference, not a proven cause. For a side-by-side test, use theme A/B when available.</div></div>`;
}
function cohortGrid(){
  const months=["Feb","Mar","Apr","May","Jun","Jul"];
  const base=[[100,22,14,11,9,8],[100,26,17,13,11,null],[100,21,13,10,null,null],[100,24,15,null,null,null],[100,23,null,null,null,null],[100,null,null,null,null,null]];
  let h=`<div class="card"><strong style="font-size:14px;">Repeat purchase cohorts (% ordering again)</strong>
   <div class="cohort" style="margin-top:12px;"><div class="h">Cohort</div>${["M0","M1","M2","M3","M4","M5"].map(m=>`<div class="h">${m}</div>`).join("")}`;
  base.forEach((row,i)=>{h+=`<div class="h" style="text-align:left;">${months[i]} 2026</div>`+row.map(v=>{
    if(v===null)return `<div class="c" style="background:#f5f8f8;color:#c8d4d5;">–</div>`;
    const t=Math.min(1,v/28);
    return `<div class="c" style="background:rgba(29,158,117,${(0.08+t*0.55).toFixed(2)});color:${t>0.6?'#fff':'#0f6e56'};">${v}%</div>`;}).join("");});
  h+=`</div><div class="note">Mar cohort retains best (26% by M1). Compare its acquisition mix.</div></div>`;
  return h;
}
function engageCard(){
  return `<div class="card"><strong style="font-size:14px;">Visitor intent segments</strong>
   <table style="margin-top:10px;"><tr><th>Segment</th><th class="num">Visitors</th><th class="num">CR</th></tr>
   <tr><td>New visitors</td><td class="num">58.1K</td><td class="num">1.9%</td></tr>
   <tr><td><strong>Returning · same product</strong> <span class="badge">high intent</span></td><td class="num">9.4K</td><td class="num" style="color:var(--teal);font-weight:600;">6.8%</td></tr>
   <tr><td>Returning · different products</td><td class="num">14.2K</td><td class="num">3.1%</td></tr></table>
   <div class="note">1,240 visitors returned to the same product this week without buying → retargeting opportunity.</div></div>`;
}
/* ---------- lens ---------- */
function renderLens(){
  document.querySelectorAll("#lens button").forEach(b=>b.classList.toggle("on",b.dataset.l===lensOn));
  let h="";
  if(lensOn==="acq"){
    h=`<div class="grid4">${["nvis","nshare","nvcr","eng"].map(k=>kpiCard(k)).join("")}</div>
       <div class="sec">${channelTable()}</div>`;
    el("lensBody").innerHTML=h;["nvis","nshare","nvcr","eng"].forEach(spark);
  }else if(lensOn==="conv"){
    h=`<div class="grid5">${["pvr","atc","cco","aban","aov"].map(k=>kpiCard(k)).join("")}</div>
       <div class="sec split32">
         <div>${storeFunnel()}</div><div>${checkoutFunnel()}</div></div>
       <div class="sec split32">
         <div>${designImpact()}</div><div>${productQuadrants()}</div></div>`;
    el("lensBody").innerHTML=h;["pvr","atc","cco","aban","aov"].forEach(spark);
  }else{
    h=`<div class="grid4">${["rvr","rpr","t2o","r30"].map(k=>kpiCard(k)).join("")}</div>
       <div class="sec split32">
         <div>${cohortGrid()}</div><div>${engageCard()}</div></div>`;
    el("lensBody").innerHTML=h;["rvr","rpr","t2o","r30"].forEach(spark);
  }
}
document.querySelectorAll("#lens button").forEach(b=>b.onclick=()=>{lensOn=b.dataset.l;renderLens();});
/* ---------- insights ---------- */
function renderInsights(){
  el("insights").innerHTML=`
   <div class="card insight"><span class="tag">Fix</span>
    <p><strong>Checkout completion on mobile COD dropped to 61%</strong> this period, 22 pts below Apple Pay. Most drop-offs happen at the confirmation step.</p>
    <button class="cta">Review payment settings</button> <button class="cta ghost">See funnel</button></div>
   <div class="card insight pos"><span class="tag">Opportunity</span>
    <p><strong>"gift box" searches up 52%</strong> but your gift category has only 4 products. Add a gift collection before demand peaks.</p>
    <button class="cta">Create collection</button> <button class="cta ghost">Search report</button></div>`;
}
/* ---------- drill-down ---------- */
let mDim="ch",mKey=null;
const DIMLBL={ch:"Channel",dev:"Device",city:"City",theme:"Theme version"};
const CITY=[["Riyadh",.32,1.15],["Jeddah",.21,1.05],["Dammam",.10,1.20],["Makkah",.08,0.95],["Other cities",.29,0.75]];
function scaleAgg(a,sh,crm){return{s:a.s*sh,pv:a.pv*sh,atc:a.atc*sh*Math.sqrt(crm),co:a.co*sh*crm,pay:a.pay*sh*crm,ord:a.ord*sh*crm,rev:a.rev*sh*crm};}
function drillEntries(k){
  const cur=rows(0,F.range),prv=rows(F.range,F.range);
  if(mDim==="ch"||mDim==="dev"){
    const g=rs=>{const m={};for(const r of rs){(m[r[mDim]]=m[r[mDim]]||[]).push(r);}return m;};
    const mc=g(cur),mp=g(prv);
    return Object.keys(mc).map(n=>{const a=agg(mc[n]),b=agg(mp[n]||[]);return{n,a,cv:k.v(a),pv:k.v(b)};});
  }
  if(mDim==="city"){
    const a=agg(cur),b=agg(prv);
    return CITY.map(([n,sh,crm],i)=>{const aa=scaleAgg(a,sh,crm),bb=scaleAgg(b,sh,crm*(0.94+i*0.03));return{n,a:aa,cv:k.v(aa),pv:k.v(bb)};});
  }
  const w=Math.min(F.range,THEME_DAY);
  const a1=agg(rows(0,w)),a0=agg(rows(THEME_DAY,Math.max(F.range-THEME_DAY,THEME_DAY)));
  return[{n:"Raed v2.3 (current)",a:a1,cv:k.v(a1),pv:k.v(a0)},{n:"Raed v2.2 (previous)",a:a0,cv:k.v(a0),pv:k.v(a0)}];
}
function renderDrillBreakdown(){
  const k=KPI[mKey];
  const es=drillEntries(k).map(e=>{const d=deltaTxt(e.cv,e.pv,k.pts);
    return{...e,d,mov:k.pts?e.cv-e.pv:(e.pv?100*(e.cv-e.pv)/e.pv:0)};});
  es.sort((x,y)=>Math.abs(y.mov)-Math.abs(x.mov));
  el("mTable").innerHTML=`<table><tr><th>${DIMLBL[mDim]}</th><th class="num">Value</th><th class="num">Change</th></tr>
    ${es.map(e=>`<tr><td>${e.n}</td><td class="num">${k.f(e.a)}</td><td class="num ${e.d.c}">${e.d.t}</td></tr>`).join("")}</table>`
    +(mDim==="theme"?`<div class="note">Time-window comparison before and after your theme update, not side-by-side traffic. Change compares v2.3 vs v2.2.</div>`:"");
  el("mMovers").innerHTML=es.slice(0,3).map(e=>{const up=e.mov>0;
    return `<div class="mover"><span>${e.n}</span><span class="${up?'up':'down'}" style="font-weight:600;">${up?"▲":"▼"} ${Math.abs(e.mov).toFixed(1)}${k.pts?" pts":"%"}</span></div>`;}).join("")
    +`<div class="note">Top movers explain most of the period change.</div>`;
}
function openDrill(key){
  const k=KPI[key];mKey=key;
  el("mDimSel").value=mDim;
  el("mTitle").textContent=k.lbl;
  el("mSub").textContent=`Last ${F.range} days vs previous ${F.range} · ${F.ch==="all"?"all channels":F.ch} · ${F.dev==="all"?"all devices":F.dev} · updated hourly`;
  const cur=daily(rows(0,F.range),k.v),prev=daily(rows(F.range,F.range),k.v);
  mkChart("mChart",{type:"line",data:{labels:cur.map((_,i)=>"D"+(i+1)),datasets:[
    {label:"Current",data:cur,borderColor:"#0f6e56",borderWidth:2,pointRadius:0,tension:.35},
    {label:"Previous",data:prev,borderColor:"#9db0b2",borderWidth:1.5,borderDash:[5,4],pointRadius:0,tension:.35}]},
    options:{plugins:{legend:{position:"bottom",labels:{boxWidth:12,font:{size:11}}}},scales:{y:{ticks:{font:{size:11}}},x:{ticks:{font:{size:10},maxTicksLimit:10}}},responsive:true,maintainAspectRatio:false,animation:false}});
  renderDrillBreakdown();
  el("mActionTxt").textContent=k.act;
  el("mCta").textContent=k.cta;
  el("overlay").classList.add("open");
}
function closeDrill(){el("overlay").classList.remove("open");}
/* ---------- filters ---------- */
CH.forEach(c=>{const o=document.createElement("option");o.value=c.n;o.textContent=c.n;el("fChannel").appendChild(o);});
function setF(){F={range:+el("fRange").value,ch:el("fChannel").value,dev:el("fDevice").value};renderAll();}
function renderAll(){
  el("cmpChip").textContent=`vs previous ${F.range} days`;
  renderPulse();renderTrend();renderLens();renderInsights();
}
renderAll();
</script>
